# nested_podman — a container machine that can itself run containers.
#
# This is the machine you put a *second* bx inside. bx normally runs one
# machine per project; this one is for the case where the machine is itself a
# place a runtime lives, so `bx` can be invoked inside it and boot its own
# child machine. Depth composes: a recipe that `extends` this one inherits the
# capability, so the child can nest in turn.
#
# Two things make it work, and neither is a magic word:
#
#   1. runtime_args passes the backend's own create-time flags through verbatim.
#      podman needs `--privileged` (and `--cgroupns=host`) before a container
#      inside it can run: a nested runtime raises memory-lock limits and writes
#      cgroup files that an unprivileged container cannot. bx does not infer
#      this, because `--privileged` reaches past the mount fence — it is the
#      one place a recipe widens what the machine can touch. It must be asked
#      for, it is recorded in the shape, and it is warned about at create time.
#
#   2. The bootstrap installs podman and points its storage at a `vfs` driver.
#      The guest rootfs is itself an overlayfs, and podman's default `overlay`
#      driver refuses to start over one; `vfs` is full-copy but correct. See
#      the containers-in-guest note in the top-level README.
#
# The graphroot lives under /work, so images pulled by a nested layer survive
# the child machine's stop and are visible to the parent — one image store for
# the whole recursion rather than one per level.

[nested_podman]
backend      = podman
image        = docker.io/library/debian:bookworm-slim
cpus         = 4
mem          = 4096
net          = host
runtime_args = --privileged
runtime_args = --cgroupns=host
mounts       = $PWD:/work
workdir      = /work

bootstrap = set -euo pipefail
    export DEBIAN_FRONTEND=noninteractive
    INSTALLED_NOW=0
    if ! command -v podman >/dev/null 2>&1; then
      apt-get update -q
      apt-get install -yq --no-install-recommends podman ca-certificates
      INSTALLED_NOW=1
    fi
    # Point podman at a vfs store under /work so images survive the machine's
    # stop and every depth shares one store. Rewritten only when it is absent,
    # so a warm boot is a no-op and stays quiet.
    if [[ ! -f /etc/containers/storage.conf ]]; then
      mkdir -p /etc/containers /work/.bx/containers/storage
      printf '[storage]\ndriver = "vfs"\nrunroot = "/run/containers/storage"\ngraphroot = "/work/.bx/containers/storage"\n' \
        > /etc/containers/storage.conf
    fi
    if [[ "$INSTALLED_NOW" == "1" ]]; then
      printf 'nested_podman: podman %s ready (storage driver vfs)\n' "$(podman --version | awk '{print $3}')" >&2
    fi
