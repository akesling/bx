# default — the generic sandbox shape: a Debian image with $PWD mounted at
# /work. A machine recipe: it has no command, so it is never run on its own.
#
# `pi`, `bash`, and `sandbox` all reference it, which is the point: the shape
# lives once, and the command recipes stay about commands.

[default]
image    = debian:bookworm-slim
cpus     = 2
mem      = 1024
mounts   = $PWD:/work
workdir  = /work
