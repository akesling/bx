# sandbox — a bare interactive Debian shell in a machine with only $PWD
# mounted. No agent, no account, no provider.
#
# This recipe exists to prove pi is not special: two recipes make a book. It
# is also a decent way to poke at a machine by hand.
#
#   bx sandbox                 # a shell in the guest, /work = your directory
#   bx sandbox -c 'uname -a'   # extra arguments are appended to the command
#
# The shape comes from the `default` machine, shared with `bash`.

[sandbox]
machine  = default
command  = exec bash
