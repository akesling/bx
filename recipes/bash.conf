# bash — run a bash command in a machine with only $PWD mounted. No agent,
# no account, no provider.
#
# The command is whatever you pass after the recipe name: bx appends extra
# arguments to `command`, so `bx bash -c 'uname -a'` runs `bash -c 'uname -a'`
# in the guest. Nothing is interpreted on the host.
#
#   bx bash -c 'uname -a'                 # one command, once
#   bx bash -c 'go test ./...'            # a build, in the machine
#   bx bash                              # an interactive bash
#
# The shape comes from the `default` machine, so this file is only the command.

[bash]
machine  = default
command  = bash
