# pi — the pi coding agent, in a microVM, with only your project mounted.
#
# This is a command recipe: it names the machine it runs on (`pi_agent`, in
# machines/pi_agent.conf) and supplies the command. The resolver provides the
# host-specific values — machine name, model, gateway, secrets. Nothing here is
# known to bx: delete this file and bx is unchanged. See recipes/README.md.
#
# Keys the resolver provides:
#   name                     the machine name (one per working directory)
#   @param AGENT_MODEL       the resolved model
#   @param AGENT_CONTEXT_WINDOW, AGENT_MAX_TOKENS
#   secret_env ...           secrets (gateway, key, model) passed by name
#   bootstrap_env ...        names the bootstrap reads
#   pre_command              copy the compaction extension in, when present
#
# `$AGENT_MODEL` etc. below are recipe references, not shell: bx substitutes
# them from the resolver's params. Everything else is the guest shell.

[pi]
resolve  = pi.resolve
machine  = pi_agent
command  = export PATH="/root/.bun/bin:/usr/local/bin:$PATH"; export PI_CODING_AGENT_DIR="/work/.pi/agent"; exec pi --provider subconscious --model "$MODEL"
